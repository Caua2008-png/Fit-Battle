<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitBattle - Domine o desafio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="landing.css">
</head>
<body>

<header class="landing-header">
  <div class="logo"><span class="fit">FIT</span><span class="battle">BATTLE</span></div>
  <h1 class="hero-title">Domine o desafio</h1>
</header>

<div class="hero-collage">
  <div class="hero-photo" style="--from:#3a5a8c; --to:#1c2b45;"><i class="ti ti-bike" aria-hidden="true"></i></div>
  <div class="hero-photo" style="--from:#3f7fd1; --to:#122b52;"><i class="ti ti-run" aria-hidden="true"></i></div>
  <div class="hero-photo" style="--from:#c0392b; --to:#4a120c;"><i class="ti ti-barbell" aria-hidden="true"></i></div>
  <div class="hero-photo" style="--from:#0f3d4c; --to:#031014;"><i class="ti ti-swimming" aria-hidden="true"></i></div>
  <div class="hero-photo" style="--from:#8a5a3c; --to:#2c1c12;"><i class="ti ti-mountain" aria-hidden="true"></i></div>
</div>

<section class="cta-section">
  <a href="/cadastro" class="btn-inscreva">inscreva-se agora</a>

  <div class="feature-list">
    <div class="feature-item">
      <span class="feature-label">Estatísticas</span>
      <i class="ti ti-chart-line feature-icon stats" aria-hidden="true"></i>
    </div>
    <div class="feature-item">
      <span class="feature-label">Ranks</span>
      <i class="ti ti-trophy feature-icon ranks" aria-hidden="true"></i>
    </div>
    <div class="feature-item">
      <span class="feature-label">Objetivos diários</span>
      <i class="ti ti-users feature-icon goals" aria-hidden="true"></i>
    </div>
  </div>
</section>

</body>
</html>
